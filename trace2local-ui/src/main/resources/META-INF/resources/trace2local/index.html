<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trace2Local — Resonance</title>
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Trace2Local Resonance: anatomia, linha do tempo, investigação e mocks da execução local (LocalStack/AWS).">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div id="app">
    <header id="topbar">
      <button type="button" class="icon ghost" id="btn-rail" title="Mostrar/ocultar painel lateral ( [ )" aria-label="Mostrar ou ocultar painel lateral">
        <svg class="i" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></div>
        <div><h1>TRACE2LOCAL</h1><small>RESONANCE</small></div>
      </div>
      <div class="top-meta">
        <span id="env-app" class="chip">app —</span>
        <span id="env-mode" class="chip">modo —</span>
      </div>
      <div class="top-spacer"></div>
      <button type="button" class="cmd-trigger" id="btn-palette" aria-label="Buscar e navegar (Ctrl+K)">
        <svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <span class="grow">Buscar execução, componente, insight…</span>
        <span class="kbds"><kbd>Ctrl</kbd> <kbd>K</kbd></span>
      </button>
      <div class="top-spacer"></div>
      <span id="engine-chip" class="chip engine-chip" title="Motor de micro-decisões (ADR-011)" role="button" tabindex="0">motor —</span>
      <div class="conn" aria-live="polite">
        <span id="conn-led" class="led"></span>
        <span id="conn-text">conectando…</span>
      </div>
    </header>

    <aside id="rail" aria-label="Projeto, execuções e insights">
      <nav class="rail-tabs" aria-label="Seções do painel lateral">
        <button type="button" data-rail="exec" class="active">EXECUÇÕES <span id="rail-exec-count" class="badge-count hidden">0</span></button>
        <button type="button" data-rail="api">API</button>
        <button type="button" data-rail="ins">INSIGHTS <span id="rail-ins-count" class="badge-count err hidden">0</span></button>
      </nav>
      <div class="rail-body" id="rail-exec">
        <div class="rail-search">
          <input id="exec-filter" type="search" placeholder="Filtrar por rótulo, status, trigger…" aria-label="Filtrar execuções" autocomplete="off">
        </div>
        <div id="exec-list" role="list" aria-label="Execuções recentes"></div>
        <div class="row" id="exec-actions">
          <button type="button" class="small ghost" id="btn-clear" title="Limpar o acervo de execuções (o histórico/baseline é mantido)">Limpar acervo</button>
        </div>
      </div>
      <div class="rail-body hidden" id="rail-api">
        <div class="rail-section-title">API DO PROJETO <span id="api-app" class="chip hidden"></span></div>
        <div id="endpoints" role="list" aria-label="Endpoints descobertos"></div>
      </div>
      <div class="rail-body hidden" id="rail-ins">
        <div class="rail-section-title">PONTOS DE ATENÇÃO <span class="muted">· ranqueados</span></div>
        <div id="ins-list" role="list" aria-label="Insights preditivos"></div>
      </div>
    </aside>

    <main id="stage">
      <div class="stage-head">
        <nav class="seg views" id="views" aria-label="Modos de exame">
          <button type="button" data-view="anatomy" title="Anatomia do ecossistema (1)">Anatomia</button>
          <button type="button" data-view="tree" title="Árvore da execução (2)">Árvore</button>
          <button type="button" data-view="timeline" title="Linha do tempo + CloudWatch (3)">Linha do tempo</button>
          <button type="button" data-view="investigate" title="Investigação técnica + executiva (4)">Investigação</button>
          <button type="button" data-view="story" title="Narrativa de negócio (5)">Narrativa</button>
          <button type="button" data-view="dashboard" title="Painel e histórico (6)">Painel</button>
          <button type="button" data-view="compare" title="Comparar execuções (7)">Comparar</button>
          <button type="button" data-view="infra" title="Infra & DevOps (8)">Infra</button>
          <button type="button" data-view="mocks" title="Mock Connect — simular APIs e variações (9)">Mocks <span id="mocks-count" class="badge-count hidden">0</span></button>
        </nav>
        <div class="stage-tools">
          <button type="button" class="small" id="btn-export" disabled title="Exportar a execução (.tvtrace)">Exportar</button>
          <button type="button" class="small ghost" id="btn-help" title="Atalhos (?)">?</button>
        </div>
      </div>
      <div class="exec-strip hidden" id="exec-strip" aria-live="polite"></div>
      <div class="views-host" id="views-host">
        <section class="view canvas hidden" id="view-anatomy" aria-label="Anatomia do ecossistema"></section>
        <section class="view canvas hidden" id="view-tree" aria-label="Árvore da execução"></section>
        <section class="view hidden" id="view-timeline" aria-label="Linha do tempo"></section>
        <section class="view hidden" id="view-investigate" aria-label="Investigação"></section>
        <section class="view hidden" id="view-story" aria-label="Narrativa"></section>
        <section class="view hidden" id="view-dashboard" aria-label="Painel"></section>
        <section class="view hidden" id="view-compare" aria-label="Comparar"></section>
        <section class="view hidden" id="view-infra" aria-label="Infra e DevOps"></section>
        <section class="view hidden" id="view-mocks" aria-label="Mock Connect"></section>
      </div>
      <aside id="drawer" aria-label="Inspetor do passo" aria-hidden="true"></aside>
    </main>

    <footer id="statusbar">
      <span id="sb-buffer">buffer —</span><span class="sep"></span>
      <span id="sb-pipeline">análise —</span><span class="sep"></span>
      <span id="sb-logs">logs —</span><span class="sep"></span>
      <span id="sb-jev">Jev —</span>
      <span class="grow"></span>
      <span id="sb-dropped" class="warn hidden"></span>
      <span class="muted">local-first · nada sai da máquina sem opt-in</span>
    </footer>
  </div>

  <div id="palette" class="hidden" role="dialog" aria-modal="true" aria-label="Paleta de comandos"></div>
  <div id="toasts" role="status" aria-live="polite"></div>
  <div id="tooltip" class="tooltip hidden" role="tooltip"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
