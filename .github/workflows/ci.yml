name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (JDK ${{ matrix.jdk }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        jdk: [21, 25]
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK ${{ matrix.jdk }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}
          cache: maven
      - name: Build + testes unitários
        run: mvn -B -ntp install

  e2e:
    name: E2E (LocalStack via Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: OrderJourneyIT + StationJourneyIT (order-service)
        run: mvn -B -ntp -Pit -pl examples/order-service verify
      - name: LambdaSqsJourneyIT (lambda-sqs — J1/J2/J3)
        run: mvn -B -ntp -Pit -pl examples/lambda-sqs verify
