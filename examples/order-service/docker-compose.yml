# App de exemplo das jornadas JC-1/JC-2/JC-3 (SPEC §3.1, E9).
# Uso: docker compose up  →  http://localhost:9876/trace2local
services:
  localstack:
    image: localstack/localstack:4.2
    ports:
      - "4566:4566"
    environment:
      - SERVICES=dynamodb,sns,sqs
      - AWS_DEFAULT_REGION=us-east-1
      - PERSISTENCE=0

  init-localstack:
    image: amazon/aws-cli:2.22.0
    depends_on:
      - localstack
    environment:
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
    entrypoint:
      - /bin/sh
      - -c
      - |
        until aws --endpoint-url=http://localstack:4566 dynamodb list-tables >/dev/null 2>&1; do sleep 1; done
        aws --endpoint-url=http://localstack:4566 dynamodb create-table \
          --table-name orders \
          --attribute-definitions AttributeName=pk,AttributeType=S \
          --key-schema AttributeName=pk,KeyType=HASH \
          --billing-mode PAY_PER_REQUEST || true
        aws --endpoint-url=http://localstack:4566 sns create-topic --name order-events || true
        aws --endpoint-url=http://localstack:4566 sqs create-queue --queue-name billing-queue || true
        aws --endpoint-url=http://localstack:4566 sns subscribe \
          --topic-arn arn:aws:sns:us-east-1:000000000000:order-events \
          --protocol sqs \
          --notification-endpoint arn:aws:sqs:us-east-1:000000000000:billing-queue || true
        echo "LocalStack pronto: tabela orders, tópico order-events, fila billing-queue"

  order-service:
    build:
      context: ../..
      dockerfile: examples/order-service/Dockerfile
    ports:
      - "8080:8080"   # a aplicação
      - "9876:9876"   # Trace2Local Embedded
    environment:
      - LOCALSTACK_ENDPOINT=http://localstack:4566
      - ORDERS_SNS_TOPIC_ARN=arn:aws:sns:us-east-1:000000000000:order-events
      - ORDERS_BILLING_QUEUE_URL=http://localstack:4566/000000000000/billing-queue
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
      - SPRING_PROFILES_ACTIVE=dev
    depends_on:
      init-localstack:
        condition: service_completed_successfully

  # Modo Companion (ADR-002, M7): rode com `docker compose --profile companion up`
  trace2local-station:
    profiles: ["companion"]
    build:
      context: ../..
      dockerfile: examples/order-service/Dockerfile.station
    ports:
      - "9876:9876"
